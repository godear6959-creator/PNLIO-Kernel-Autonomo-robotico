[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pnlio-robot-kernel"
version = "0.1.0"
description = "Kernel PNLIO orientado a seguridad con autorización humana y estado fail-safe"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Gonzalo Mauricio De la Rivera Arellano"}]
license = {text = "Apache-2.0"}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
